# Cloud refresh (2026-11-17). Lives in the PUBLIC site repo (fr-dashboard) as .github/workflows/cloud-refresh.yml, where
# Actions minutes are free. Everything this prints is public: fr cloud-run prints only statuses and counts, and the
# refresh's own log goes to a file that is never uploaded. Secrets come only from the repository's Actions secrets.
# Times are weekdays, US Eastern standard time (UTC-5): 06:30, 09:45, 12:30, 16:30, 18:30. In daylight time they run
# an hour later by the clock. GitHub may start a scheduled run a few minutes late.
name: cloud-refresh
on:
  schedule:
    - cron: "30 11 * * 1-5"
    - cron: "45 14 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "30 21 * * 1-5"
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
concurrency:
  group: cloud-refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Site (this repo)
        uses: actions/checkout@v4
        with:
          path: site
      - name: Code (private, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: ubajwa02/fundamental-researcher
          ssh-key: ${{ secrets.CODE_DEPLOY_KEY }}
          path: code
          persist-credentials: false
      - name: State slice (private, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: ubajwa02/fr-state
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install
        run: pip install --quiet --disable-pip-version-check -r code/requirements.txt > /dev/null
      - name: Refresh and publish (newest data wins; secret scan before publish)
        working-directory: code
        env:
          FR_SEC_CONTACT: ${{ secrets.FR_SEC_CONTACT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FR_DATA_DIR: ${{ runner.temp }}/data
        run: |
          git -C ../site config user.name "fr-cloud-refresh"
          git -C ../site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m fr cloud-run --site ../site --state ../state/state 2> "$RUNNER_TEMP/refresh.log"
